<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management</title>
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <main>
      <!-- Chap tomon: Sidebar -->
      <section class="section-sidebar">
        <div class="sidebar">
          <a href="./index.html" class="logo">User Management</a>

          <div class="links">
            <a href="./index.html" class="active">Users</a>
          </div>
        </div>
      </section>

      <!-- O'ng tomon: Asosiy qism -->
      <section class="main-section">
        <div class="top-bar">
          <h1>Users</h1>
          <button class="add-btn">Add user</button>
        </div>

        <div class="users-table">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Image</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Role</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1</td>
                <td>
                  <img
                    src="https://i.pravatar.cc/150?img=12"
                    alt="Ali Valiyev"
                    class="user-img"
                  />
                </td>
                <td>Ali</td>
                <td>Valiyev</td>
                <td>ali@gmail.com</td>
                <td>22</td>
                <td><span class="role admin">Admin</span></td>
              </tr>
            </tbody>
            <tbody></tbody>
          </table>
        </div>
      </section>
      
    </main>
   
    
 <div class="modal-overlay hidden" id="userModal">
      <div class="modal-container">
        <div class="modal-header">
          <h2>Foydalanuvchi ma'lumotlari</h2>
          <button type="button" class="close-btn">&times;</button>
        </div>

        <form class="user-form">
          <div class="form-row">
            <div class="form-group">
              <label for="firstName">Ism (First Name)</label>
              <input
                type="text"
                id="firstName"
                name="firstName"
                placeholder="Masalan: Diyor"
                required
              />
            </div>

            <div class="form-group">
              <label for="lastName">Familiya (Last Name)</label>
              <input
                type="text"
                id="lastName"
                name="lastName"
                placeholder="Masalan: Usmonov"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="diyor@gmail.com"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="age">Yosh (Age)</label>
              <input
                type="number"
                id="age"
                name="age"
                min="1"
                max="120"
                placeholder="30"
                required
              />
            </div>

            <div class="form-group">
              <label for="role">Lavozim (Role)</label>
              <select id="role" name="role" required>
                <option value="" disabled selected>Tanlang...</option>
                <option value="Admin">Admin</option>
                <option value="Manager">Manager</option>
                <option value="User">User</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="image">Rasm havolasi (Image URL)</label>
            <input
              type="url"
              id="image"
              name="image"
              placeholder="https://randomuser.me/api/portraits/men/64.jpg"
              required
            />
          </div>

          <div class="modal-footer">
            <button type="button" class="btn cancel-btn">Bekor qilish</button>
            <button type="submit" class="btn submit-btn">Saqlash</button>
          </div>
        </form>
      </div>
    </div>


    <script type="module" src="./js/app.js"></script>
  </body>
</html>
